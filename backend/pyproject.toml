[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
contextpack = "contextpack.cli:app"
name = "contextpack"
version = "0.1.0"
description = "Turn a local codebase into a token-counted markdown digest for LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "pathspec>=0.12",
  "tiktoken>=0.7",
  "tree-sitter>=0.24",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
contextpack = "contextpack.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/contextpack"]

[tool.pytest.ini_options]
testpaths = ["tests"]